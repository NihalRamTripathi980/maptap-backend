server.port=8080
spring.application.name=api-gateway
spring.profiles.active=dev


spring.config.import=optional:configserver:




# actuator
management.endpoints.web.base-path=/manage/api-gateway
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always


# eureka
spring.cloud.config.discovery.enabled=true
spring.cloud.config.discovery.service-id=config-server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/


# Auth
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# User
spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/**

# Borrow
spring.cloud.gateway.routes[2].id=borrow-service
spring.cloud.gateway.routes[2].uri=lb://borrow-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/borrow/**
